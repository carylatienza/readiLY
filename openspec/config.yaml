schema: spec-driven

# Project context: shown to AI when creating artifacts.
# Source of truth: .agents/plans/00-master-build-plan.md (sections 2 and 5). Keep this in step with it.
context: |
  Product: readiLY, an offline oral-reading assessment app for Grade 1-3 teachers in Philippine public schools.
  A teacher records a learner reading a passage; the app scores word recognition on the device.

  Stack (locked 2026-07-18): Kotlin, native Android, Jetpack Compose + Material 3, MVVM, Hilt, Room,
  sherpa-onnx for on-device speech recognition, Supabase (Postgres + Auth) for optional sync.
  Single :app module, package com.readily.app, minSdk 28, target 4 GB RAM tablets and phones. JDK 17.
  Layout: data/local/entity, data/local/dao, data/repository, ui/<feature>, scoring/, audio/.
  Room: ReadilyDatabase, no destructive migration; one version bump plus AutoMigration per schema change.
  Tests: JUnit4, MockK, Turbine, Robolectric for DAO tests on the JVM. CI runs ktlintCheck and lintDebug.

  Hard constraints:
  - Offline-first: every feature works in airplane mode; the app is fully usable with no account.
  - No sequence-to-sequence recogniser (Whisper, Moonshine or similar); transducer or HMM models only.
  - Audio never leaves the device: not for processing, backup, logs or crash reports.
  - Cloud identity is initials + LRN; full names stay in Room on the device.
  - Model and runtime fit in about 200 MB of RAM, INT8. MVP model: sherpa-onnx-zipformer-gigaspeech-2023-12-12.
  - English-only automatic scoring; Filipino sessions are teacher-scored and never show a machine score.
  - Original passages only; no DepEd, CRLA or Phil-IRI passage text is bundled.
  - No predictive claims; flags are deterministic rules and the interface says so.
  - No INTERNET permission, analytics or crash reporting until the sync phase.

  Honesty rules: a number not measured in a classroom is a "design target", never a result.
  Named children (Miguel, Bea, Paolo) are illustrative learners and always labelled.
  The app measures word recognition, not comprehension ("Oral Reading (Word Recognition) Level").
  User-facing strings say "learner"; code identifiers keep Student*.

